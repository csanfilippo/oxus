name: CI

on:
  push:
    branches: [main]
    paths: &code
      - Sources/**
      - Tests/**
      - Package.swift
      - Package.resolved
      - .swift-format
      - .github/workflows/ci.yml
  pull_request:
    paths: *code

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # xcode-27 is GitHub's preview image on macOS 27; there is no macos-27 label yet.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - name: Lint
        run: swift format lint --strict -r Sources Tests Package.swift
      - name: Test
        # The runner's Spotlight never answers, so tests that query it hang; run them locally.
        run: swift test --skip AcceptanceTests --skip MacOSAdaptersTests
